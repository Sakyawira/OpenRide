<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Request a ride and follow its progress across the OpenRide network.">
  <meta name="theme-color" content="#19425E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OpenRide Rider">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/png" href="favicon.png">
  <title>OpenRide Rider</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; background: #F2FCFD; color: #19425E; }
    #openride-loading {
      position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
      background: #F2FCFD; text-align: center; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #openride-loading img { width: 112px; height: 112px; }
    #openride-loading h1 { font-size: 30px; letter-spacing: -1px; margin: 18px 0 8px; }
    #loading-message { color: #526F80; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="openride-loading" role="status" aria-live="polite">
    <div>
      <img src="logo.svg" alt="OpenRide Rider logo" width="112" height="112">
      <h1>OpenRide Rider</h1>
      <p id="loading-message">Getting your workspace ready…</p>
      <noscript>Enable JavaScript to open the rider app.</noscript>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
